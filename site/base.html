<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#080b12" />
  <meta name="color-scheme" content="dark light" />
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}" />
  <meta name="generator" content="DeployIndex zero-dependency static generator" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="{{TITLE}}" />
  <meta property="og:description" content="{{DESCRIPTION}}" />
  <meta property="og:image" content="/assets/og.svg" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="canonical" href="{{CANONICAL_URL}}" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/assets/styles.css" />
  <script>
    (() => {
      const saved = localStorage.getItem('deployindex-theme');
      const theme = saved || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  {{HEAD_EXTRA}}
</head>
<body class="{{BODY_CLASS}}">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <header class="site-header">
    <div class="header-inner shell">
      <a class="brand" href="/" aria-label="DeployIndex home">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
        <span class="brand-word">deploy<span>/</span>index</span>
      </a>
      <nav class="main-nav" aria-label="Primary navigation">
        <a href="/">Catalog</a>
        <a href="/method/">Method</a>
        <a href="/catalog/providers.json">JSON API</a>
        <a href="{{REPOSITORY_URL}}" class="nav-github" data-external>GitHub</a>
      </nav>
      <button class="icon-button theme-toggle" type="button" aria-label="Toggle color theme" title="Toggle color theme">
        <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"></path></svg>
        <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      </button>
    </div>
  </header>
  <main id="main">{{MAIN}}</main>
  <footer class="site-footer">
    <div class="shell footer-grid">
      <div>
        <a class="brand footer-brand" href="/"><span class="brand-word">deploy<span>/</span>index</span></a>
        <p>An open, evidence-aware map of the hosting universe.</p>
      </div>
      <div class="footer-links">
        <a href="/method/">Methodology</a>
        <a href="/catalog/providers.json">Catalog JSON</a>
        <a href="/catalog/schema.json">Schema</a>
        <a href="/sitemap.xml">Sitemap</a>
      </div>
      <p class="footer-meta">Built as portable static files. No affiliate ranking. No silent removals.</p>
    </div>
  </footer>
  <script src="/assets/theme.js" defer></script>
  {{SCRIPTS}}
</body>
</html>

name: Deploy static site to Cloudflare Workers

on:
  # Superseded by deploy-pages.yml. The push trigger is disabled so the two
  # deploy workflows do not race on every merge; this one requires SITE_URL,
  # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, none of which are set.
  # Re-enable the push trigger (and remove deploy-pages.yml) to go back to
  # Cloudflare, or delete this workflow once Pages is settled.
  #   push:
  #     branches: [main]
  workflow_dispatch:

concurrency:
  group: deployindex-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Require canonical production URL
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "Repository variable SITE_URL is required, for example https://deployindex.com" >&2
            exit 1
          fi
      - name: Build and verify
        run: make test
      - name: Deploy static assets
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy

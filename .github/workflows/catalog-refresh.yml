name: Weekly catalog research

on:
  # The weekly schedule is disabled: this workflow requires OPENAI_API_KEY, which
  # is not configured, so every scheduled run would fail and file a failure issue.
  # Restore the cron below once the secret exists, or delete this workflow if the
  # research scan moves off GitHub Actions.
  #   schedule:
  #     - cron: "17 7 * * 1"   # Monday 07:17 UTC; the odd minute avoids top-of-hour load
  workflow_dispatch:

concurrency:
  group: deployindex-weekly-catalog-research
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-luna' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Require research credentials
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "Repository secret OPENAI_API_KEY is required." >&2
            exit 1
          fi
      - name: Validate baseline
        run: |
          python scripts/validate.py
          python -m unittest discover -s tests -v
      - name: Research current hosting landscape
        id: dates
        shell: bash
        run: |
          TODAY="$(date -u +%F)"
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          python scripts/research.py \
            --date "$TODAY" \
            --output "catalog/proposals/$TODAY.json"
      - name: Stage safe catalog changes
        shell: bash
        run: |
          TODAY="${{ steps.dates.outputs.today }}"
          python scripts/apply_proposal.py \
            "catalog/proposals/$TODAY.json" \
            --report "catalog/proposals/$TODAY.report.json"
          python scripts/proposal_markdown.py \
            "catalog/proposals/$TODAY.json" \
            --report "catalog/proposals/$TODAY.report.json" \
            --output "/tmp/catalog-pr.md"
      - name: Build and test proposed catalog
        env:
          SITE_URL: https://example.invalid
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: make test
      - name: Open review pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain --untracked-files=all catalog/proposals)" ]; then
            echo "No catalog changes or proposal artifacts to publish."
            exit 0
          fi
          BRANCH="automation/catalog-refresh-${GITHUB_RUN_ID}"
          git config user.name "deployindex-research[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add catalog/providers.json catalog/proposals/
          git commit -m "catalog: weekly research ${{ steps.dates.outputs.today }}"
          git push --set-upstream origin "$BRANCH"
          gh pr create \
            --base "$DEFAULT_BRANCH" \
            --head "$BRANCH" \
            --title "Catalog research — ${{ steps.dates.outputs.today }}" \
            --body-file /tmp/catalog-pr.md
      - name: Surface workflow failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          TITLE="Weekly catalog research failed — $(date -u +%F)"
          if gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq 'length' | grep -qv '^0$'; then
            echo "An open failure issue already exists for today."
            exit 0
          fi
          gh issue create \
            --title "$TITLE" \
            --body "The scheduled catalog research workflow failed before a pull request could be opened. No proposal was published this week. Inspect the run log: $RUN_URL"
